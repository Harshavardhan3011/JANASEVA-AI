name: Daily scheme discovery

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janaseva-scheme-discovery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --prefix backend
      - run: npm --prefix backend run build
      - name: Install verified Supabase database CA
        run: node .github/scripts/install-supabase-ca.cjs
      - name: Check official sources using the shared production database
        run: npm run schemes:sync
        env:
          NODE_ENV: production
          NODE_EXTRA_CA_CERTS: /tmp/supabase-ca.crt
          SCHEME_SYNC_WORKER: 'true'
          DATABASE_URL: ${{ secrets.JANASEVA_DATABASE_URL }}
          INGESTION_DATABASE_URL: ${{ secrets.JANASEVA_INGESTION_DATABASE_URL }}
          LLM_PROVIDER: ${{ vars.JANASEVA_LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.JANASEVA_LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.JANASEVA_LLM_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.JANASEVA_TAVILY_API_KEY }}
          SCHEME_SEARCH_API_KEY: ${{ secrets.JANASEVA_SCHEME_SEARCH_API_KEY }}
          SCHEME_CATALOG_AUTO_PUBLISH: 'true'
