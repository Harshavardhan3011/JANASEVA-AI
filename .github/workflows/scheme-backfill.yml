name: Backfill scheme details

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum records in this batch (1-100)
        default: '3'
        required: true
      scheme_id:
        description: Optional existing scheme UUID
        required: false
      retry:
        description: Requeue a completed or failed record
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: janaseva-scheme-discovery
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --prefix backend
      - run: npm --prefix backend run build
      - name: Resume official field enrichment
        shell: bash
        run: |
          args=(--limit="$BACKFILL_LIMIT")
          if [ -n "$TARGET_SCHEME" ]; then args+=(--scheme="$TARGET_SCHEME"); fi
          if [ "$RETRY_RECORDS" = 'true' ]; then args+=(--retry); fi
          npm run schemes:backfill -- "${args[@]}"
        env:
          NODE_ENV: production
          SCHEME_SYNC_WORKER: 'true'
          SCHEME_ENRICHMENT_ENABLED: 'true'
          DATABASE_URL: ${{ secrets.JANASEVA_DATABASE_URL }}
          INGESTION_DATABASE_URL: ${{ secrets.JANASEVA_INGESTION_DATABASE_URL }}
          LLM_PROVIDER: ${{ vars.JANASEVA_LLM_PROVIDER || 'gemini' }}
          LLM_API_KEY: ${{ secrets.JANASEVA_LLM_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.JANASEVA_TAVILY_API_KEY }}
          SCHEME_SEARCH_API_KEY: ${{ secrets.JANASEVA_SCHEME_SEARCH_API_KEY }}
          BACKFILL_LIMIT: ${{ inputs.batch_size }}
          TARGET_SCHEME: ${{ inputs.scheme_id }}
          RETRY_RECORDS: ${{ inputs.retry }}
