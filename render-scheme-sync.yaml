services:
  - type: cron
    name: janaseva-scheme-sync
    runtime: docker
    dockerfilePath: ./Dockerfile.scheme-sync
    schedule: "0 2 * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: SCHEME_CATALOG_AUTO_PUBLISH
        value: "true"
